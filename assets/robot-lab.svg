<title id="robot-art-title">A robot following an illustrative path</title><desc id="robot-art-desc">A top view of a four-wheel robot on a coordinate grid. A mint dashed route shows a possible path, with an arrow showing the illustrated robot heading. This is a coordinate exercise, not a competition field.</desc>
